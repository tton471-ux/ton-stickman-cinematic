name: TON Stickman Studio

on:
  push:
    branches: [studio-desktop-web-foundation]
    paths:
      - "apps/ton-stickman-studio/**"
      - "skills/ton-stickman-cinematic/vendor/upstream/**"
      - "vendor/upstream-source"
      - ".github/workflows/ton-stickman-studio.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ton-stickman-studio/**"
      - "skills/ton-stickman-cinematic/vendor/upstream/**"
      - "vendor/upstream-source"
      - ".github/workflows/ton-stickman-studio.yml"

jobs:
  studio-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Studio local API
        working-directory: apps/ton-stickman-studio
        run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Materialize pinned runtime assets
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "vendor/upstream-source/skills/directing-stickman-videos"
          $target = Join-Path $env:GITHUB_WORKSPACE "skills/ton-stickman-cinematic/vendor/upstream"
          foreach ($folder in @("assets", "references", "examples")) {
            $destination = Join-Path $target $folder
            if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            $origin = Join-Path $source $folder
            if (Test-Path $origin) { Copy-Item (Join-Path $origin "*") $destination -Recurse -Force }
          }
      - name: Bundle FFmpeg binaries
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem "C:\\ProgramData\\chocolatey\\lib\\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found after installation" }
          $bin = $ffmpeg.Directory.FullName
          $destination = Join-Path $env:GITHUB_WORKSPACE "apps/ton-stickman-studio/vendor/ffmpeg"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $bin "ffmpeg.exe") $destination -Force
          Copy-Item (Join-Path $bin "ffprobe.exe") $destination -Force
      - name: Install upstream runtime dependencies
        working-directory: skills/ton-stickman-cinematic/vendor/upstream
        run: npm ci
      - name: Install Studio packaging dependencies
        working-directory: apps/ton-stickman-studio
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: apps/ton-stickman-studio
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ton-stickman-cinematic-windows-x64
          path: apps/ton-stickman-studio/dist/*.exe
          if-no-files-found: error
