services:
  - type: web
    name: ton-stickman-cinematic-studio
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./apps/ton-stickman-studio/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ton-stickman-studio-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: TON_STUDIO_HOST
        value: 0.0.0.0
      - key: TON_PROJECTS_DIR
        value: /var/data/TonStickmanProjects
      - key: TON_STUDIO_AUTH_USER
        sync: false
      - key: TON_STUDIO_AUTH_PASSWORD
        sync: false
